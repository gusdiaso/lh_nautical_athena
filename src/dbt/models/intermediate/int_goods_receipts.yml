version: 2

models:
  - name: int_goods_receipts
    description: "Recebimentos de mercadorias padronizados."
    columns:
      - name: goods_receipt_id
        data_tests:
          - not_null
          - unique

      - name: purchase_order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_purchase_orders')
              field: purchase_order_id
