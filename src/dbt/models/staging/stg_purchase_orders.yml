version: 2

models:
  - name: stg_purchase_orders
    description: "Pedidos de compra."
    columns:
      - name: purchase_order_id
        data_tests:
          - not_null
          - unique

      - name: po_number
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

      - name: buyer_id
        data_tests:
          - not_null

      - name: destination_location_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - draft
                  - received
                  - partially_received
                  - sent

      - name: currency
        data_tests:
          - not_null

      - name: subtotal
        data_tests:
          - not_null

      - name: original_total
        data_tests:
          - not_null

      - name: placed_at
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - relationships:
              to: ref('stg_suppliers')
              field: supplier_id

      - name: buyer_id
        data_tests:
          - relationships:
              to: ref('stg_employees')
              field: employee_id

      - name: destination_location_id
        data_tests:
          - relationships:
              to: ref('stg_locations')
              field: location_id
