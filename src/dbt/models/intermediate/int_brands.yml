version: 2
models:
  - name: int_brands
    description: Marcas dos produtos, deduplicadas e padronizadas.
    columns:
      - name: brand_id
        description: Identificador único da marca (PK).
        data_tests:
          - not_null
          - unique
      - name: brand_name
        description: Nome da marca.
        data_tests:
          - not_null

      - name: country
        description: País de origem da marca.
        data_tests:
          - not_null

      - name: is_active
        description: Indicador se a marca está ativa no catálogo.
        data_tests:
          - not_null
