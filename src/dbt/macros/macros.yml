version: 2

macros:
  - name: generate_schema_name
    description: |
      Evita que o dbt concatene o schema do profile com o schema customizado definido
      em `+schema` no `dbt_project.yml`. Usa diretamente o schema informado na
      configuração do modelo, garantindo que staging, intermediate e marts sejam
      materializados exatamente nos schemas `silver` e `gold` conforme definido
      no projeto, independentemente do schema configurado no profile de conexão.
    arguments:
      - name: custom_schema_name
        type: string
        description: >
          Nome do schema customizado definido no `dbt_project.yml` via `+schema`.
          Quando `none`, usa o schema padrão do target.
      - name: node
        type: object
        description: >
          Objeto do nó atual do dbt (model, seed, snapshot, etc.). Fornecido
          automaticamente pelo dbt — não deve ser passado manualmente.

  - name: sk_from_keys
    description: |
      Gera uma surrogate key (chave substituta) a partir de uma ou mais colunas
      usando `md5(concat_ws('||', col1, col2, ...))`.       Centraliza a geração de
      chaves `sk_*` nas 5 dimensões e 5 fatos, garantindo consistência entre
      todos os modelos marts.
    arguments:
      - name: columns
        type: list of strings
        description: >
          Lista de nomes de colunas (como strings) cujos valores serão
          concatenados com `||` e hashizados com MD5. A ordem importa para
          garantir a unicidade da chave.

  - name: clean_cep
    description: |
      Remove caracteres não numéricos de uma coluna de CEP e formata o resultado
      no padrão `XXXXX-XXX`.
    arguments:
      - name: column_name
        type: string
        description: >
          Nome da coluna (expressão SQL) que contém o CEP a ser limpo e
          formatado. Deve ser passado como string ou referência direta à coluna.

  - name: default_supplier_sku
    description: |
      Normaliza o SKU do fornecedor aplicando `trim` e substituindo valores
      nulos ou placeholders (`'TBD'`, `'?'`, `'SEM-CODIGO'`, `''`) por um
      identificador gerado no formato `SUP-{supplier_id_padded}-{product_variant_id_padded}`.

      Centraliza a lógica que antes estava duplicada entre
      `int_product_suppliers` e as fatos, garantindo o mesmo comportamento
      em todos os modelos que expõem `supplier_sku`.
    arguments:
      - name: sku_column
        type: column expression
        description: >
          Expressão SQL da coluna original do SKU. Exemplos:
          `supplier_sku`, `product_suppliers.supplier_sku`.
      - name: supplier_id
        type: column expression
        description: >
          Expressão SQL da coluna com o ID do fornecedor para o fallback.
          Exemplos: `supplier_id`, `receipt_base.supplier_id`,
          `purchase_orders.supplier_id`.
      - name: product_variant_id
        type: column expression
        description: >
          Expressão SQL da coluna com o ID da variante do produto para o fallback.
          Exemplos: `product_variant_id`, `receipt_base.product_variant_id`,
          `purchase_order_items.product_variant_id`.

  - name: create_mask_functions
    description: |
      Cria (idempotente, `CREATE OR REPLACE`) as 4 funções de máscara
      (`mask_full`, `mask_cpf`, `mask_email`, `mask_phone`) no schema
      `gold` do catálogo do target atual. Executada via
      `dbt run-operation create_mask_functions` como primeiro step do job
      `dbt_transform`, antes de qualquer model rodar — sem isso, o job
      dependeria implicitamente de `apply_bronze_masks.py` (Bronze) ter
      rodado antes na mesma execução do orchestrator, mas `dbt_transform`
      também é disparado manualmente para reprocessamento e precisa
      funcionar sozinho. Usa `target.name` para decidir o grupo
      (`lh_nautical_dev` ou `lh_nautical_prod`), então funciona igual em
      dev e prod.
    arguments: []

  - name: mask_post_hooks
    description: |
      Gera a lista de post-hooks que mascaram colunas sensíveis na
      sequência imediata da criação do model — mesma etapa, sem step
      separado depois. Usada no `config()` de `int_customers`,
      `int_employees`, `int_suppliers`, `dim_customers`, `dim_employees`
      e `dim_suppliers`. Como `materialized=table` recria a tabela (e
      apaga a máscara anterior) a cada run, aplicar via post-hook fecha a
      janela de exposição de dados sensíveis para a duração de um único
      `ALTER TABLE` (segundos), em vez do tempo restante do run daquela
      camada inteira.
    arguments:
      - name: columns
        type: dict
        description: >
          Mapa coluna → função de máscara, ex:
          `{'tax_id': 'mask_full', 'email': 'mask_email', 'phone': 'mask_phone'}`.

  - name: apply_column_masks
    description: |
      Reaplica Column Masking em todas as tabelas Silver e Gold sensíveis
      de uma vez. Executada via `dbt run-operation apply_column_masks`
      como step final no job `dbt_transform`, após materialização e
      testes de todas as camadas — redundante com os post-hooks de
      `mask_post_hooks` (que já cobrem o caso comum), mantida como
      segunda camada de garantia sem custo adicional (é uma operação de
      metadado, não reescreve dados), útil por exemplo após um `dbt run`
      parcial fora do fluxo padrão.
    arguments: []

  - name: get_region_by_state
    description: |
      Retorna a região geográfica do Brasil (Norte, Nordeste, Centro-Oeste,
      Sudeste ou Sul) com base na sigla da unidade federativa. Centraliza
      o mapeamento estado→região nas dimensões `dim_customers` e
      `dim_locations`, evitando duplicação da regra de negócio.
    arguments:
      - name: state_column
        type: column expression
        description: >
          Expressão SQL da coluna que contém a sigla da unidade federativa
          (ex.: `state`, `selected_addresses.state`). O valor é normalizado
          com `upper(trim(...))` antes da comparação.

  - name: get_state_name_by_uf
    description: |
      Retorna o nome completo do estado brasileiro, sem acentuação, com base
      na sigla da unidade federativa. Centraliza o mapeamento UF→nome do
      estado nas dimensões `dim_customers` e `dim_locations`, evitando
      duplicação da regra de negócio.
    arguments:
      - name: state_column
        type: column expression
        description: >
          Expressão SQL da coluna que contém a sigla da unidade federativa
          (ex.: `state`, `selected_addresses.state`). O valor é normalizado
          com `upper(trim(...))` antes da comparação.
