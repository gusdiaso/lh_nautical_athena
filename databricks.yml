# Configuração do Databricks Asset Bundle
bundle:
  name: lh_nautical
  uuid: 6cbf77ec-43aa-4f6b-8cde-df1732439764

# Inclui os recursos YAML do projeto
include:
  - resources/*.yml
  - resources/*/*.yml

# Sincroniza os arquivos do dbt e Python para o workspace
sync:
  include:
    - dbt_project.yml
    - src/dbt/**
    - src/*/*.py

# Permissões padrão do bundle
permissions:
  - user_name: ${workspace.current_user.userName}
    level: CAN_MANAGE
  - group_name: lh_nautical_dev
    level: CAN_VIEW

# Workspace Databricks de destino
workspace:
  host: https://dbc-c4e046bc-37b5.cloud.databricks.com

# Ambientes de implantação
targets:
  dev:
    default: true
    mode: development
    permissions:
      - group_name: lh_nautical_dev
        level: CAN_MANAGE

  prod:
    mode: production
    permissions:
      - group_name: lh_nautical_prod
        level: CAN_VIEW
    git:
      branch: main
    # Define a identidade que será dona (owner) dos recursos em produção
    run_as:
      service_principal_name: '1d6b3e3c-c04d-41e0-9883-ae8d467adcaf'
