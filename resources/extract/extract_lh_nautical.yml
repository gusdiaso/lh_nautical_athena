    extract_exchange_rates:
      name: extract_exchange_rates
      description: "Job diário que ingere cotações PTAX do Banco Central para a camada Bronze."
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 18 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests
              - pandas

      tasks:
        - task_key: extract_bcb_exchange_rates
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_exchange_rates.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --start-date
              - "2019-07-01"
              - --load-mode
              - incremental
              