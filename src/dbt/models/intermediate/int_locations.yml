version: 2

models:
  - name: int_locations
    description: "Lojas e armazéns padronizados."
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

      - name: location_name
        data_tests:
          - not_null

      - name: location_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - store
                  - warehouse

      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
