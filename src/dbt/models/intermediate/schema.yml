version: 2

models:
  - name: int_brands
    description: "Intermediate for brands - cleaned brand registry"
    columns:
      - name: brand_id
        description: "Chave natural da marca na camada silver."
        data_tests: [unique, not_null]
      - name: name
        description: "Nome da marca sem espacos excedentes."
        data_tests: [not_null]
      - name: country
        description: "Pais padronizado em maiusculo."
      - name: is_active
        description: "Indica se a marca esta ativa."

  - name: int_categories
    description: "Intermediate for categories - cleaned product taxonomy"
    columns:
      - name: category_id
        description: "Chave natural da categoria na camada silver."
        data_tests: [unique, not_null]
      - name: name
        description: "Nome da categoria sem espacos excedentes."
        data_tests: [not_null]
      - name: slug
        description: "Slug da categoria padronizado em minusculo."
      - name: parent_category_id
        description: "Referencia para a categoria pai."
        data_tests:
          - relationships:
              to: ref('int_categories')
              field: category_id
      - name: is_active
        description: "Indica se a categoria esta ativa."

  - name: int_customers
    description: "Intermediate for customers - cleaned client registry"
    columns:
      - name: customer_id
        description: "Chave natural do cliente na camada silver."
        data_tests: [unique, not_null]
      - name: person_type
        description: "Tipo de pessoa padronizado em minusculo."
      - name: legal_name
        description: "Nome ou razao social sem espacos excedentes."
        data_tests: [not_null]
      - name: trade_name
        description: "Nome fantasia do cliente."
      - name: tax_id
        description: "CPF ou CNPJ do cliente."
      - name: state_registration
        description: "Inscricao estadual do cliente."
      - name: email
        description: "Email de contato padronizado em minusculo."
      - name: phone
        description: "Telefone de contato do cliente."
      - name: is_active
        description: "Indica se o cadastro esta ativo."

  - name: int_employees
    description: "Intermediate for employees - cleaned staff registry"
    columns:
      - name: employee_id
        description: "Chave natural do colaborador na camada silver."
        data_tests: [unique, not_null]
      - name: full_name
        description: "Nome completo sem espacos excedentes."
        data_tests: [not_null]
      - name: cpf
        description: "CPF do colaborador."
      - name: email
        description: "Email corporativo padronizado em minusculo."
      - name: role
        description: "Cargo ou funcao padronizado em minusculo."
      - name: primary_location_id
        description: "Unidade principal do colaborador."
      - name: hire_date
        description: "Data de admissao do colaborador."
      - name: termination_date
        description: "Data de desligamento, quando existir."
      - name: is_active
        description: "Indica se o colaborador esta ativo."

  - name: int_goods_receipts
    description: "Intermediate for goods receipts - cleaned inbound receipt documents"
    columns:
      - name: goods_receipt_id
        description: "Chave natural do recebimento na camada silver."
        data_tests: [unique, not_null]
      - name: purchase_order_id
        description: "Pedido de compra relacionado ao recebimento."
        data_tests: [not_null]
      - name: received_by_employee_id
        description: "Colaborador que recebeu a mercadoria."
        data_tests:
          - relationships:
              to: ref('int_employees')
              field: employee_id
      - name: received_at
        description: "Data e hora do recebimento."
      - name: notes
        description: "Observacoes do recebimento sem espacos excedentes."

  - name: int_orders
    description: "Intermediate for orders - cleaned sales order headers"
    columns:
      - name: order_id
        description: "Chave natural do pedido na camada silver."
        data_tests: [unique, not_null]
      - name: order_number
        description: "Numero comercial do pedido sem espacos excedentes."
        data_tests: [not_null]
      - name: channel
        description: "Canal de venda padronizado em minusculo."
      - name: customer_id
        description: "Cliente associado ao pedido."
        data_tests:
          - relationships:
              to: ref('int_customers')
              field: customer_id
      - name: salesperson_id
        description: "Colaborador que realizou a venda."
        data_tests:
          - relationships:
              to: ref('int_employees')
              field: employee_id
      - name: location_id
        description: "Unidade de origem do pedido."
      - name: status
        description: "Status atual do pedido padronizado em minusculo."
      - name: subtotal
        description: "Valor bruto dos itens do pedido."
      - name: discount_amount
        description: "Valor total de desconto aplicado."
      - name: total
        description: "Valor total liquido do pedido."
      - name: placed_at
        description: "Data e hora de confirmacao do pedido."

  - name: int_payments
    description: "Intermediate for payments - cleaned payment transactions"
    columns:
      - name: payment_id
        description: "Chave natural do pagamento na camada silver."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Pedido relacionado ao pagamento."
        data_tests:
          - relationships:
              to: ref('int_orders')
              field: order_id
      - name: method
        description: "Metodo de pagamento padronizado em minusculo."
      - name: installments
        description: "Numero de parcelas."
      - name: amount
        description: "Valor pago na transacao."
      - name: status
        description: "Status da transacao de pagamento padronizado em minusculo."
      - name: paid_at
        description: "Data e hora da confirmacao do pagamento."

  - name: int_product_suppliers
    description: "Intermediate for product-supplier relationship - cleaned supplier offers by variant"
    columns:
      - name: sk_product_supplier
        description: "Chave substituta da relacao produto-fornecedor."
        data_tests: [unique, not_null]
      - name: product_variant_id
        description: "Variante do produto na camada silver."
        data_tests: [not_null]
      - name: supplier_id
        description: "Fornecedor na camada silver."
        data_tests: [not_null]
      - name: supplier_sku
        description: "SKU do fornecedor sem espacos excedentes."
      - name: last_quoted_cost
        description: "Ultimo custo cotado pelo fornecedor."
      - name: lead_time_days
        description: "Prazo de entrega em dias."
      - name: is_preferred
        description: "Indica se o fornecedor e preferencial."