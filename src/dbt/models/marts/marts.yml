        description: "Chave da localização que recebeu a devolução."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: sk_location

      - name: sk_date
        description: "Chave da data da devolução."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: sk_date

      - name: return_number
        description: "Número comercial da devolução."
        data_tests:
          - not_null

      - name: return_status
        description: "Status da devolução."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - open
                  - completed
                  - cancelled

      - name: original_reason
        description: "Motivo original registrado no ERP."

      - name: reason_normalized
        description: "Motivo textual normalizado."

      - name: return_reason_group
        description: "Grupo analítico padronizado do motivo."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - compra_duplicada
                  - desistencia_cliente
                  - divergencia_descricao
                  - avaria_transporte
                  - tamanho_cor_incorretos
                  - defeito_fabrica
                  - nao_informado
                  - outros

      - name: action
        description: "Ação aplicada ao item."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
