version: 2
models:
  - name: stg_orders
    description: Pedidos de venda.
    columns:
      - name: channel
        description: Canal da venda (loja física, e-commerce, etc).
      - name: customer_id
        description: Referência ao comprador (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: discount_amount
        description: Valor do desconto concedido.
      - name: location_id
        description: Referência à filial de origem (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_locations')
                field: location_id
      - name: order_id
        description: Identificador único do pedido (PK).
        data_tests:
          - not_null
          - unique
      - name: order_number
        description: Número oficial do pedido exibido ao cliente.
      - name: placed_at
        description: Data/hora em que o pedido foi finalizado.
      - name: salesperson_id
        description: Referência ao vendedor (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: status
        description: Status do pedido no fluxo de vida.
      - name: subtotal
        description: Soma bruta dos valores dos produtos.
      - name: total
        description: Valor líquido final a cobrar do cliente.
