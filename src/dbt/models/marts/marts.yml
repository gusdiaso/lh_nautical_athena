        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sk_product

      - name: sk_customer
        description: "Chave da dimensão de clientes."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: sk_customer

