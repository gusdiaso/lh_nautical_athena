                  - nao_classificado

      - name: quantity
        description: "Quantidade com sinal da movimentação."
        data_tests:
          - not_null

      - name: absolute_quantity
        description: "Magnitude absoluta da movimentação."
        data_tests:
          - not_null

      - name: notes
        description: "Observações operacionais."

      - name: occurred_at
        description: "Data e hora registrada para a movimentação."
        data_tests:
          - not_null

      - name: is_legacy_migration
        description: "Indica saldo inicial proveniente da migração legada."
        data_tests:
