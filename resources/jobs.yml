variables:
  catalog:
    description: 'Catalog do Unity Catalog'
  schema:
    description: 'Schema do Unity Catalog'
    default: raw

targets:
  dev:
    variables:
      catalog: dev_lh_nautical
      schema: raw

  prod:
    variables:
      catalog: prod_lh_nautical
      schema: raw

resources:
  jobs:
    extract_data:
      name: extract_data
      description: 'Job que executa as 24 tasks, uma por tabela da camada raw'
      max_concurrent_runs: 1
      parameters:
        - name: tables
          default: '["order_items","payments","fiscal_invoices","purchase_orders","purchase_order_items","customers","goods_receipts","suppliers","goods_receipt_items","locations","returns","employees","addresses","return_items","categories","brands","products","product_variants","attributes","variant_attribute_values","product_suppliers","stock_levels","stock_movements","orders"]'
      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies: []
      tasks:
        - task_key: extract_tables
          for_each_task:
            inputs: '{{job.parameters.tables}}'
            concurrency: 5
            task:
              task_key: extract_table
              environment_key: default
              spark_python_task:
                python_file: ../src/ingestion/extract_to_raw.py
                parameters:
                  - --table
                  - '{{input}}'
