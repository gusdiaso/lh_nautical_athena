resources:
  jobs:
    extract_raw_24_tasks:
      name: extract_raw_24_tasks
      description: "Job que executa as 24 tasks, uma por tabela da camada raw"
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: []
      tasks:
        - task_key: extract_order_items
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/ch2_extract_raw.py
            parameters:
              - --table
              - order_items
        - task_key: extract_payments
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/ch2_extract_raw.py
            parameters:
              - --table
              - payments
