version: 2

models:
  - name: stg_categories
    description: "Staging for categories - product taxonomy hierarchy"
    columns:
      - name: category_id
        description: "Natural key da categoria na bronze."
        data_tests: [unique, not_null]
      - name: name
        description: "Nome amigavel da categoria."
        data_tests: [not_null]
      - name: slug
        description: "Versao amigavel da categoria para URL."
      - name: parent_category_id
        description: "Categoria pai para formar a hierarquia."
      - name: is_active
        description: "Indica se a categoria esta ativa."

  - name: stg_brands
    description: "Staging for brands - product brand registry"
    columns:
      - name: brand_id
        description: "Natural key da marca na bronze."
        data_tests: [unique, not_null]
      - name: name
        description: "Nome da marca."
        data_tests: [not_null]
      - name: country
        description: "Pais de origem da marca."
      - name: is_active
        description: "Indica se a marca esta ativa."

  - name: stg_customers
    description: "Staging for customers - client registry"
    columns:
      - name: customer_id
        description: "Natural key do cliente na bronze."
        data_tests: [unique, not_null]
      - name: person_type
        description: "Tipo de pessoa do cliente."
      - name: legal_name
        description: "Nome ou razao social do cliente."
        data_tests: [not_null]
      - name: trade_name
        description: "Nome fantasia do cliente."
      - name: tax_id
        description: "CPF ou CNPJ do cliente."
      - name: state_registration
        description: "Inscricao estadual do cliente."
      - name: email
        description: "Email de contato do cliente."
      - name: phone
        description: "Telefone de contato do cliente."
      - name: is_active
        description: "Indica se o cadastro esta ativo."

  - name: stg_employees
    description: "Staging for employees - internal staff registry"
    columns:
      - name: employee_id
        description: "Natural key do colaborador na bronze."
        data_tests: [unique, not_null]
      - name: full_name
        description: "Nome completo do colaborador."
        data_tests: [not_null]
      - name: cpf
        description: "CPF do colaborador."
      - name: email
        description: "Email corporativo do colaborador."
      - name: role
        description: "Cargo ou funcao do colaborador."
      - name: primary_location_id
        description: "Unidade principal do colaborador."
      - name: hire_date
        description: "Data de admissao do colaborador."
      - name: termination_date
        description: "Data de desligamento, quando existir."
      - name: is_active
        description: "Indica se o colaborador esta ativo."

  - name: stg_orders
    description: "Staging for orders - sales order headers"
    columns:
      - name: order_id
        description: "Natural key do pedido na bronze."
        data_tests: [unique, not_null]
      - name: order_number
        description: "Numero comercial do pedido."
        data_tests: [not_null]
      - name: channel
        description: "Canal de venda do pedido."
      - name: customer_id
        description: "Cliente associado ao pedido."
        data_tests: [not_null]
      - name: salesperson_id
        description: "Colaborador que realizou a venda."
      - name: location_id
        description: "Unidade de origem do pedido."
      - name: status
        description: "Status atual do pedido."
      - name: subtotal
        description: "Valor bruto dos itens do pedido."
      - name: discount_amount
        description: "Valor total de desconto aplicado."
      - name: total
        description: "Valor total liquido do pedido."
      - name: placed_at
        description: "Data e hora de confirmacao do pedido."

  - name: stg_payments
    description: "Staging for payments - payment transactions linked to orders"
    columns:
      - name: payment_id
        description: "Natural key do pagamento na bronze."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Pedido relacionado ao pagamento."
        data_tests: [not_null]
      - name: method
        description: "Metodo de pagamento utilizado."
      - name: installments
        description: "Numero de parcelas."
      - name: amount
        description: "Valor pago na transacao."
      - name: status
        description: "Status da transacao de pagamento."
      - name: paid_at
        description: "Data e hora da confirmacao do pagamento."

  - name: stg_goods_receipts
    description: "Staging for goods receipts - inbound logistics receipt documents"
    columns:
      - name: goods_receipt_id
        description: "Natural key do recebimento na bronze."
        data_tests: [unique, not_null]
      - name: purchase_order_id
        description: "Pedido de compra relacionado ao recebimento."
        data_tests: [not_null]
      - name: received_by_employee_id
        description: "Colaborador que recebeu a mercadoria."
      - name: received_at
        description: "Data e hora do recebimento."
      - name: notes
        description: "Observacoes do recebimento."

  - name: stg_product_suppliers
    description: "Staging for product-supplier relationship - supplier offers by product variant"
    columns:
      - name: sk_product_supplier
        description: "Surrogate key para a relacao composta product_variant_id + supplier_id."
        data_tests: [unique, not_null]
      - name: product_variant_id
        description: "Variante do produto na bronze."
        data_tests: [not_null]
      - name: supplier_id
        description: "Fornecedor na bronze."
        data_tests: [not_null]
      - name: supplier_sku
        description: "SKU do fornecedor para a variante."
      - name: last_quoted_cost
        description: "Ultimo custo cotado pelo fornecedor."
      - name: lead_time_days
        description: "Prazo de entrega em dias."
      - name: is_preferred
        description: "Indica se o fornecedor e preferencial."