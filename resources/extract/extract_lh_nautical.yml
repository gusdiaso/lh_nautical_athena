variables:
  catalog:
    description: 'Catalog do Unity Catalog'
  schema:
    description: 'Schema do Unity Catalog'
    default: bronze

targets:
  dev:
    variables:
      catalog: dev_lh_nautical
      schema: bronze

  prod:
    variables:
      catalog: prod_lh_nautical
      schema: bronze

resources:
  jobs:
    extract_to_bronze:
      name: extract_to_bronze
      description: 'Job que executa as 24 tasks, uma para cada tabela diretamente para o formato Delta.'
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies: []
      tasks:
        - task_key: extract_order_items
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_to_bronze.py
            parameters:
              - --table
              - order_items
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

        - task_key: extract_payments
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_to_bronze.py
            parameters:
              - --table
