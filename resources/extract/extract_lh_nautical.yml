# Variáveis reutilizáveis do job
variables:
  catalog:
    description: 'Catálogo no Unity Catalog'
  schema:
    description: 'Schema de destino no Unity Catalog'
    default: bronze

# Targets de implantação: define valores concretos para cada ambiente
targets:
  dev:
    variables:
      catalog: dev_lh_nautical
      schema: bronze

  prod:
    variables:
      catalog: prod_lh_nautical
      schema: bronze

# Extrai dados brutos do ERP e carrega na camada Bronze do Lakehouse
resources:
  jobs:
    extract_lh_nautical:
      # Nome, descrição e limite de execuções concorrentes
      name: extract_lh_nautical
      description: 'Job que executa as 24 tasks, uma para cada tabela diretamente para o formato Delta.'
      max_concurrent_runs: 1

      # Ambiente de execução: versão e dependências
      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies: []

      # Tasks de extração — uma por tabela, todas usam o mesmo script Python
      tasks:
        - task_key: extract_order_items # Extrai dados da tabela order_items
          environment_key: default
          spark_python_task: # Executa script Python no Spark
            python_file: ../../src/ingestion/extract_lh_nautical.py # Caminho do script de extração
            parameters: # Parâmetros: tabela alvo, catálogo e schema
              - --table
              - order_items
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

        - task_key: extract_payments
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_lh_nautical.py
            parameters:
              - --table
              - payments
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

        - task_key: extract_fiscal_invoices
