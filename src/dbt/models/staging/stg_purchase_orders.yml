version: 2
models:
  - name: stg_purchase_orders
    description: Pedidos de compra emitidos aos fornecedores.
    columns:
      - name: buyer_id
        description: Referência ao comprador responsável (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: currency
        description: Moeda do pedido (ISO 4217).
        data_tests:
          - not_null
      - name: destination_location_id
        description: Referência ao local de entrega (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_locations')
                field: location_id
      - name: expected_delivery_at
        description: Prazo máximo de entrega pactuado.
      - name: original_total
        description: Valor total original do pedido na moeda de origem.
        data_tests:
          - not_null
      - name: placed_at
        description: Data de fechamento do pedido.
        data_tests:
          - not_null
      - name: po_number
        description: Número do pedido de compra.
        data_tests:
          - not_null
      - name: purchase_order_id
        description: Identificador único do pedido de compra (PK).
        data_tests:
          - not_null
          - unique
      - name: status
        description: Status do pedido de compra.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - draft
                  - received
                  - partially_received
                  - sent
      - name: subtotal
        description: Soma dos valores dos itens.
        data_tests:
          - not_null
      - name: supplier_id
        description: Referência ao fornecedor (FK).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id
