version: 2

models:
  - name: stg_attributes
    description: "Atributos customizáveis dos produtos."
    columns:
      - name: attribute_id
        data_tests:
          - not_null
          - unique

      - name: attribute_name
        data_tests:
          - not_null

      - name: data_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - text
                  - number
                  - boolean
