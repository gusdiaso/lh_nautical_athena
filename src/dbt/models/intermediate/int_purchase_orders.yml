version: 2

models:
  - name: int_purchase_orders
    description: "Pedidos de compra padronizados com flags de entrega e moeda."

    columns:
      - name: purchase_order_id
        data_tests:
          - not_null
          - unique

      - name: po_number
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_suppliers')
              field: supplier_id

      - name: buyer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_employees')
              field: employee_id

      - name: destination_location_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_locations')
              field: location_id

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - draft
                  - received
                  - partially_received
                  - sent

      - name: currency
        data_tests:
          - not_null

      - name: subtotal
        data_tests:
          - not_null

      - name: original_total
        data_tests:
          - not_null

      - name: placed_at
        data_tests:
          - not_null

      - name: expected_delivery_at
        data_tests: []

      - name: exchange_rate_sell
        description: "Taxa de câmbio de venda (PTAX) na data do pedido, ou NULL se a moeda for BRL ou data sem cotação."
        data_tests: []

      - name: total_brl
        description: "Valor total do pedido convertido para BRL. Para moedas estrangeiras, usa a average_exchange_rate; para BRL, mantém o original_total."
        data_tests:
          - not_null

