version: 2

models:
  - name: ml_complete_monthly_demand
    description: >
      agg_demand_monthly sem os meses parciais (primeiro mês de cada
      combinação produto × loja e último mês do dataset). Base
      compartilhada de ml_seasonal_trend e ml_cutoff_panel —
      qualquer janela móvel calculada sobre um mês parcial ficaria
      distorcida.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_product
              - sk_location
              - month_start_date
    columns:
      - name: sk_product
        description: "Chave da dimensão de produtos."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sk_product

      - name: sk_location
        description: "Chave da dimensão de localizações."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: sk_location

      - name: month_start_date
        description: "Primeiro dia do mês completo ao qual a demanda se refere."
        data_tests:
          - not_null

      - name: demand_quantity
        description: "Soma de demand_quantity do mês para a combinação produto × loja."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
