version: 2

models:
  - name: int_brands
    columns:
      - name: brand_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

  - name: int_categories
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

  - name: int_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: legal_name
        data_tests:
          - not_null

  - name: int_employees
    columns:
      - name: employee_id
        data_tests:
