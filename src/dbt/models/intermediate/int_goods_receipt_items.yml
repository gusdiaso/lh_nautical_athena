version: 2

models:
  - name: int_goods_receipt_items
    description: "Itens de recebimento de mercadoria padronizados com deduplicação."

    columns:
      - name: goods_receipt_item_id
        data_tests:
          - not_null
          - unique

      - name: goods_receipt_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_goods_receipts')
              field: goods_receipt_id

      - name: purchase_order_item_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_purchase_order_items')
              field: purchase_order_item_id

      - name: quantity_received
        data_tests:
          - not_null
