version: 2

models:
  - name: int_brands
    columns:
      - name: brand_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

  - name: int_categories
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

  - name: int_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: legal_name
        data_tests:
          - not_null

  - name: int_employees
    columns:
      - name: employee_id
        data_tests:
          - not_null
          - unique

      - name: full_name
        data_tests:
          - not_null

  - name: int_goods_receipts
    columns:
      - name: goods_receipt_id
        data_tests:
          - not_null
          - unique

      - name: purchase_order_id
        data_tests:
          - not_null

  - name: int_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: order_number
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: int_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

  - name: int_product_suppliers
    columns:
      - name: sk_product_supplier
        data_tests:
          - not_null
          - unique

      - name: product_variant_id
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

  - name: int_returns
    description: "Padronização analítica dos registros de devoluções."

    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique

      - name: return_reason_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - compra_duplicada
                  - desistencia_cliente
                  - divergencia_descricao
                  - avaria_transporte
                  - tamanho_cor_incorretos
                  - defeito_fabrica
                  - nao_informado
                  - outros

      - name: has_refund_amount
        data_tests:
          - not_null

  - name: int_exchange_rates
    description: "Cotações cambiais com taxa média e spread."

    columns:
      - name: exchange_date
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - USD
                  - EUR

      - name: average_exchange_rate
        data_tests:
          - not_null

      - name: exchange_rate_spread
        data_tests:
          - not_null

  - name: int_product_variants
    description: "Variações de produtos com métricas de margem e impostos."

    columns:
      - name: product_variant_id
        data_tests:
          - not_null
          - unique

      - name: sku
        data_tests:
          - not_null
          - unique

      - name: gross_margin_amount
        data_tests:
          - not_null

      - name: gross_margin_percentage
        data_tests:
          - not_null

      - name: total_tax_rate
        data_tests:
          - not_null

      - name: is_profitable
        data_tests:
          - not_null

  - name: int_stock_movements
    description: "Movimentações de estoque com direção, quantidade absoluta e identificação de migração."

    columns:
      - name: stock_movement_id
        data_tests:
          - not_null
          - unique

      - name: movement_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - entrada
                  - saida
                  - nao_classificado

      - name: absolute_quantity
        data_tests:
          - not_null

      - name: is_legacy_migration
        data_tests:
          - not_null