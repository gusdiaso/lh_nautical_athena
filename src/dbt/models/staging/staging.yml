version: 2

models:
  - name: stg_categories
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: category_name
        data_tests:
          - not_null

  - name: stg_brands
    columns:
      - name: brand_id
        data_tests:
          - not_null
          - unique

      - name: brand_name
        data_tests:
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: stg_employees
    columns:
      - name: employee_id
        data_tests:
          - not_null
          - unique

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

  - name: stg_goods_receipts
    columns:
      - name: goods_receipt_id
        data_tests:
          - not_null
          - unique

  - name: stg_product_suppliers
    columns:
      - name: sk_product_supplier
        data_tests:
          - not_null
          - unique

      - name: product_variant_id
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

  - name: stg_stock_movements
    columns:
      - name: stock_movement_id
        data_tests:
          - not_null
          - unique

      - name: movement_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - sale_out
                  - purchase_in
                  - return_in
                  - return_out

  - name: stg_returns
    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - completed
                  - open

  - name: stg_addresses
    columns:
      - name: address_id
        data_tests:
          - not_null
          - unique

  - name: stg_product_variants
    columns:
      - name: product_variant_id
        data_tests:
          - not_null
          - unique

      - name: sku
        data_tests:
          - not_null
          - unique

  - name: stg_suppliers
    columns:
      - name: supplier_id
        data_tests:
          - not_null
          - unique

  - name: stg_stock_levels
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - location_id

  - name: stg_variant_attribute_values
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_variant_id
              - attribute_id

  - name: stg_exchange_rates
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - exchange_date
              - currency_code

  - name: stg_purchase_orders
    columns:
      - name: purchase_order_id
        data_tests:
          - not_null
          - unique

      - name: po_number
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - draft
                  - received
                  - partially_received
                  - sent

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

  - name: stg_return_items
    columns:
      - name: return_item_id
        data_tests:
          - not_null
          - unique

      - name: action
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - refund
                  - exchange

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      
      - name: brand_id
        data_tests:
          - not_null

      - name: category_id
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: stg_locations
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

      - name: postal_code
        data_tests:
          - not_null

      - name: number
        data_tests:
          - not_null
          
      - name: location_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - store
                  - warehouse

      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: stg_purchase_order_items
    columns:
      - name: purchase_order_item_id
        data_tests:
          - not_null
          - unique

  - name: stg_goods_receipt_items
    columns:
      - name: goods_receipt_item_id
        data_tests:
          - not_null
          - unique

      - name: goods_receipt_id
        data_tests:
          - not_null

      - name: purchase_order_item_id
        data_tests:
          - not_null

  - name: stg_attributes
    columns:
      - name: attribute_id
        data_tests:
          - not_null
          - unique
      
      - name: attribute_name
        data_tests:
          - not_null

      - name: data_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - text
                  - number
                  - boolean