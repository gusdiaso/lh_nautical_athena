      - name: is_refund
        description: "Indica ação de reembolso."
        data_tests:
          - not_null

      - name: has_refund_amount
        description: "Indica se a devolução possui valor de reembolso."
        data_tests:
          - not_null

      - name: returned_at
        description: "Data e hora da devolução."
        data_tests:
          - not_null

      - name: returned_item_count
        description: "Contador aditivo de itens devolvidos."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]