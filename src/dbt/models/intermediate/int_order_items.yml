version: 2

models:
  - name: int_order_items
    description: "Itens de pedido com cálculos de ICMS, IPI e total com impostos."

    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_orders')
              field: order_id

      - name: product_variant_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_product_variants')
              field: product_variant_id

      - name: quantity_ordered
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

      - name: icms_rate
        data_tests:
          - not_null

      - name: ipi_rate
        data_tests:
          - not_null

      - name: original_line_total
        data_tests:
          - not_null

      - name: icms_amount
        data_tests:
          - not_null

      - name: ipi_amount
        data_tests:
          - not_null

      - name: total_tax_amount
        data_tests:
          - not_null

      - name: total_with_taxes
        data_tests:
          - not_null
