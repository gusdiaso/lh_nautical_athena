# Variáveis reutilizáveis do job
variables:
  catalog:
    description: 'Catálogo no Unity Catalog'
  schema:
    description: 'Schema de destino no Unity Catalog'
    default: bronze

# Valores por ambiente
targets:
  dev:
    variables:
      catalog: dev_lh_nautical
      schema: bronze

  prod:
    variables:
      catalog: prod_lh_nautical
      schema: bronze

# Job de extração para a camada Bronze
resources:
  jobs:
    extract_exchange_rates:
      name: extract_exchange_rates
      description: 'Job diário que ingere cotações PTAX do Banco Central para a camada Bronze.'
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: '0 0 18 * * ?'
        timezone_id: 'America/Sao_Paulo'
        pause_status: UNPAUSED

      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies:
              - requests
              - pandas

      tasks:
        - task_key: extract_bcb_exchange_rates
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_exchange_rates.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --start-date
              - '2019-07-01'
              - --load-mode
              - incremental
