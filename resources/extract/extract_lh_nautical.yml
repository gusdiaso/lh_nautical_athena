# Variaveis reutilizaveis do job
variables:
  catalog:
    description: 'Catalogo no Unity Catalog'
  schema:
    description: 'Schema de destino no Unity Catalog'
    default: bronze

# Valores por ambiente
targets:
  dev:
    variables:
      catalog: dev_lh_nautical
      schema: bronze

  prod:
    variables:
      catalog: prod_lh_nautical
      schema: bronze

# Job de extracao para a camada Bronze
resources:
  jobs:
    extract_lh_nautical:
      name: extract_lh_nautical
      description: 'Job que executa uma task para cada tabela e grava os dados no formato Delta.'
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: '0 0 0,18 * * ?'
        timezone_id: 'America/Sao_Paulo'
        pause_status: UNPAUSED

      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies:
              - tenacity

      # Uma task por tabela (gerado automaticamente)
      tasks:
        - task_key: extract_categories
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_lh_nautical.py
            parameters:
              - --table
              - categories
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
        - task_key: extract_brands
          environment_key: default
          spark_python_task:
            python_file: ../../src/ingestion/extract_lh_nautical.py
            parameters:
              - --table
