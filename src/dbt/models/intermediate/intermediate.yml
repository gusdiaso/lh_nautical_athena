version: 2

models:
  - name: int_brands
    columns:
      - name: brand_id
        data_tests:
          - not_null
          - unique

      - name: brand_name
        data_tests:
          - not_null

  - name: int_categories
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: category_name
        data_tests:
          - not_null

  - name: int_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: legal_name
        data_tests:
          - not_null

  - name: int_locations
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

      - name: location_name
        data_tests:
          - not_null

      - name: location_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - store
                  - warehouse

      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: int_employees
    columns:
      - name: employee_id
        data_tests:
          - not_null
          - unique

      - name: full_name
        data_tests:
          - not_null

  - name: int_goods_receipts
    columns:
      - name: goods_receipt_id
        data_tests:
          - not_null
          - unique

      - name: purchase_order_id
        data_tests:
          - not_null

  - name: int_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: order_number
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: int_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

  - name: int_products
    description: "Produtos padronizados com flags de qualidade (registros incompletos e descrições ausentes)."

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: brand_id
        data_tests:
          - not_null

      - name: category_id
        data_tests:
          - not_null

      - name: ncm_code
        data_tests:
          - not_null

      - name: unit_of_measure
        data_tests:
          - not_null

      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

      - name: is_incomplete_record
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

      - name: is_missing_description
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: int_product_suppliers
    columns:
      - name: sk_product_supplier
        data_tests:
          - not_null
          - unique

      - name: product_variant_id
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

  - name: int_returns
    description: "Padronização analítica dos registros de devoluções."

    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique

      - name: return_reason_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - compra_duplicada
                  - desistencia_cliente
                  - divergencia_descricao
                  - avaria_transporte
                  - tamanho_cor_incorretos
                  - defeito_fabrica
                  - nao_informado
                  - outros

      - name: has_refund_amount
        data_tests:
          - not_null

  - name: int_return_items
    description: "Itens de devolução com classificação de ação e cálculo de reembolso por linha."

    columns:
      - name: return_item_id
        data_tests:
          - not_null
          - unique

      - name: return_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: quantity_returned
        data_tests:
          - not_null

      - name: action
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - refund
                  - exchange

      - name: is_exchange
        data_tests:
          - not_null

      - name: is_refund
        data_tests:
          - not_null

      - name: total_line_refund_amount
        data_tests:
          - not_null

  - name: int_exchange_rates
    description: "Cotações cambiais com taxa média e spread."

    columns:
      - name: exchange_date
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - USD
                  - EUR

      - name: average_exchange_rate
        data_tests:
          - not_null

      - name: exchange_rate_spread
        data_tests:
          - not_null

  - name: int_product_variants
    description: "Variações de produtos com métricas de margem e impostos."

    columns:
      - name: product_variant_id
        data_tests:
          - not_null
          - unique

      - name: sku
        data_tests:
          - not_null
          - unique

      - name: gross_margin_amount
        data_tests:
          - not_null

      - name: gross_margin_percentage
        data_tests:
          - not_null

      - name: total_tax_rate
        data_tests:
          - not_null

      - name: is_profitable
        data_tests:
          - not_null

  - name: int_order_items
    description: "Itens de pedido com cálculos de ICMS, IPI e total com impostos."

    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: product_variant_id
        data_tests:
          - not_null

      - name: quantity_ordered
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

      - name: icms_rate
        data_tests:
          - not_null

      - name: ipi_rate
        data_tests:
          - not_null

      - name: original_line_total
        data_tests:
          - not_null

      - name: icms_amount
        data_tests:
          - not_null

      - name: ipi_amount
        data_tests:
          - not_null

      - name: total_tax_amount
        data_tests:
          - not_null

      - name: total_with_taxes
        data_tests:
          - not_null

  - name: int_purchase_orders
    description: "Pedidos de compra padronizados com flags de entrega e moeda."

    columns:
      - name: purchase_order_id
        data_tests:
          - not_null
          - unique

      - name: po_number
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

      - name: buyer_id
        data_tests:
          - not_null

      - name: destination_location_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - cancelled
                  - draft
                  - received
                  - partially_received
                  - sent

      - name: currency
        data_tests:
          - not_null

      - name: subtotal
        data_tests:
          - not_null

      - name: original_total
        data_tests:
          - not_null

      - name: placed_at
        data_tests:
          - not_null

      - name: expected_delivery_at
        data_tests: []

      - name: has_expected_delivery
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

      - name: is_foreign_currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

      - name: has_total_adjustment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: int_stock_movements
    description: "Movimentações de estoque com direção, quantidade absoluta e identificação de migração."

    columns:
      - name: stock_movement_id
        data_tests:
          - not_null
          - unique

      - name: movement_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - entrada
                  - saida
                  - nao_classificado

      - name: absolute_quantity
        data_tests:
          - not_null

      - name: is_legacy_migration
        data_tests:
          - not_null

  - name: int_variant_attribute_values
    description: "Valores dos atributos das variantes, limpos e padronizados."

    columns:
      - name: product_variant_id
        data_tests:
          - not_null

      - name: attribute_id
        data_tests:
          - not_null

      - name: attribute_name
        data_tests:
          - not_null

      - name: attribute_data_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - text
                  - number
                  - boolean
                  
  - name: int_addresses
    description: "Endereços com CEP padronizado e limpeza de campos textuais."

    columns:
      - name: address_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: address_type
        data_tests:
          - not_null

      - name: postal_code
        data_tests:
          - not_null

      - name: is_primary
        data_tests:
          - not_null

  - name: int_stock_levels
    description: "Níveis de estoque com identificação de produtos sem saldo."

    columns:
      - name: product_variant_id
        data_tests:
          - not_null

      - name: location_id
        data_tests:
          - not_null

      - name: quantity_on_hand
        data_tests:
          - not_null

      - name: is_out_of_stock
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false

  - name: int_suppliers
    description: "Fornecedores com padronização de campos textuais."

    columns:
      - name: supplier_id
        data_tests:
          - not_null
          - unique

      - name: legal_name
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null

      - name: tax_id_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CNPJ
                  - VAT

      - name: is_active
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false